name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # By default, the action deletes the wheels downloaded from the internet before saving the cache. That would make the CUDA build of torch download several GB again every time.
          prune-cache: false

      - name: Sync
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # ty is not in the project dependencies, so run a pinned version on the fly. It finds the .venv made in the previous step by itself.
      - name: Type check
        run: uvx ty@0.0.91 check src

      - name: Test
        run: uv run pytest

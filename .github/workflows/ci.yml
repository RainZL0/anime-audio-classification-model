name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Linux 上 torch/torchaudio 走 CPU index（见 pyproject 的 tool.uv.sources），
      # 避免 CI 每次下载 2.6 GB 的 CUDA 轮子。
      - name: Sync
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # ty 不在项目依赖里，固定版本临时跑；它会自己找到上一步建的 .venv。
      - name: Type check
        run: uvx ty@0.0.91 check src

      - name: Test
        run: uv run pytest

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # 默认会删掉从网上下载的轮子再存缓存，那样 CUDA 版 torch 每次都要重下几个 GB。
          prune-cache: false

      - name: Sync
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # ty 不在项目依赖里，固定版本临时跑；它会自己找到上一步建的 .venv。
      - name: Type check
        run: uvx ty@0.0.91 check src

      - name: Test
        run: uv run pytest

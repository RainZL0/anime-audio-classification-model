[project]
name = "avs"
version = "0.1.0"
description = "Collect an anime character's lines: label a few, the model sorts the rest, export for voice training"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anime-speaker-embedding>=0.2",
    "audio-separator[gpu]>=0.45.0",
    "audioread>=3.1.0",
    "fastapi>=0.143.3",
    "numpy>=2.5.2",
    "pandas>=2.2",
    "pyannote-audio>=4.0",
    "pyarrow>=25.0.1",
    "pyloudnorm>=0.2.0",
    "pysubs2>=1.9.0",
    "scikit-learn>=1.6",
    "soundfile>=0.14.0",
    "torch>=2.11,<2.12",
    "torchaudio>=2.11,<2.12",
    "typer>=0.27.2",
    "uvicorn>=0.30",
]

[project.scripts]
avs = "avs.cli:app"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

# On Windows and Linux, torch and torchaudio are installed as CUDA 12.8 wheels from the
# official PyTorch index. Without an NVIDIA GPU, the same wheels still run on the CPU
# (development machine: Windows, RTX 4060 Laptop 8 GB).
# macOS has no CUDA, so it uses the default wheels from PyPI. CI also installs the CUDA
# wheels on Linux, and relies on the cache so they are not downloaded again every time.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8.4",
    "pytest-cov>=7.0",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Code blocks in the docs are illustrative snippets and are not formatted
exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",
]
# The Chinese side of the web app's messages, and Japanese subtitle examples, use full-width
# punctuation on purpose; it is not a lookalike-character attack
ignore = ["RUF001", "RUF002"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
